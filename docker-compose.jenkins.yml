version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    platform: linux/amd64
    container_name: jenkins-local
    privileged: true
    user: root
    ports:
      - "8083:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace

volumes:
  jenkins_home:

#comment: This docker-compose file defines a service called jenkins, which is built from the Dockerfile.jenkins file in the current directory. The service runs on the linux/amd64 platform and is named jenkins-local. It runs in privileged mode and as the root user. The service exposes ports 8083 and 50000, and mounts three volumes: jenkins_home for persistent Jenkins data, the Docker socket for building images, and the current directory for workspace access. The jenkins_home volume is defined at the bottom of the file for persistent storage.